<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LINETOGEL</title>
  <link rel="icon" href="/assets/img/ei/favicon.png">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0d0714;--card:#191020;--line:#382247;--purple:#7b3fc6;--gold:#f2cf68;--text:#f8f5fb;--muted:#bdb2c7}
    body{min-height:100vh;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
    .wrap{width:min(1050px,calc(100% - 24px));margin:auto}
    header{border-bottom:1px solid var(--line);background:#120a19}
    .top{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:18px}
    .logo{color:var(--gold);font-size:25px;font-weight:900;text-decoration:none;letter-spacing:1px}
    .login{display:flex;gap:8px}
    .login input{width:145px;padding:10px 12px;color:#fff;background:var(--card);border:1px solid var(--line);border-radius:7px;outline:none}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 18px;color:#fff;background:var(--purple);border:0;border-radius:7px;text-decoration:none;font-weight:700;cursor:pointer}
    .btn.alt{color:var(--gold);background:transparent;border:1px solid var(--gold)}
    .notice{padding:10px;text-align:center;color:var(--muted);background:#160d1e;border-bottom:1px solid var(--line);font-size:14px}
    main{padding:24px 0}
    .banner{overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:12px}
    .banner img{display:block;width:100%;height:auto;min-height:230px;object-fit:cover}
    .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
    .panel{margin-top:16px;padding:24px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:12px}
    .panel h1{margin-bottom:8px;color:var(--gold);font-size:28px}
    .panel p{color:var(--muted);line-height:1.6}
    footer{padding:20px;text-align:center;color:#8f8499;border-top:1px solid var(--line);font-size:13px}
    @media(max-width:720px){
      .top{padding:12px 0;flex-direction:column}.login{width:100%;display:grid;grid-template-columns:1fr 1fr}.login input{width:100%}.login .btn{grid-column:1/-1}.actions{grid-template-columns:1fr}.banner img{min-height:160px}.panel{padding:20px 15px}.panel h1{font-size:23px}
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap top">
      <a class="logo" href="/">LINETOGEL</a>
      <form class="login" method="post">
        <input type="text" name="entered_login" placeholder="Username" autocomplete="username">
        <input type="password" name="entered_password" placeholder="Password" autocomplete="current-password">
        <button class="btn" type="submit">LOGIN</button>
      </form>
    </div>
  </header>

  <div class="notice">Selamat datang di LINETOGEL — layanan tersedia 24 jam.</div>

  <main class="wrap">
    <section class="banner">
      <img src="https://cdn.areabermain.club/assets/cdn/az6/2026/07/21/20260721/381efc67f9c8693d9580f733b433bcde/slider-1-linetogel-2.png" alt="Banner LINETOGEL">
    </section>

    <nav class="actions">
      <a class="btn" href="/register">DAFTAR</a>
      <a class="btn alt" href="/promosi">PROMOSI</a>
      <a class="btn alt" href="/support">LIVE CHAT</a>
    </nav>

    <section class="panel">
      <h1>LINETOGEL</h1>
      <p>Tampilan sederhana, ringan, responsif, dan mudah digunakan di desktop maupun perangkat seluler.</p>
    </section>
  </main>

  <footer>&copy; 2026 LINETOGEL. All Rights Reserved.</footer>
</body>
</html>
