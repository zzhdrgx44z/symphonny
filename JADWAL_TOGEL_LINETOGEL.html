```html
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LINE TOGEL - Auto Live Pasaran</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0b0b12;
    color:#fff;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:18px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.title{
    font-size:24px;
    font-weight:bold;
}

.live-status{
    padding:8px 14px;
    border-radius:20px;
    background:#252532;
    font-size:13px;
}

.live-status.active{
    background:#b40000;
}

.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

input,select,button{
    border:0;
    outline:0;
    border-radius:8px;
    padding:10px 13px;
}

input,select{
    background:#1b1b27;
    color:#fff;
}

button{
    background:#6d35ff;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    opacity:.85;
}

.market-list{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:12px;
}

.market{
    background:#171722;
    border:1px solid #29293a;
    border-radius:12px;
    padding:14px;
    transition:.2s;
}

.market.active{
    border-color:#ff3333;
    box-shadow:0 0 15px rgba(255,0,0,.18);
}

.market-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
}

.market-name{
    font-size:16px;
    font-weight:bold;
}

.badge{
    font-size:11px;
    padding:5px 8px;
    border-radius:12px;
    background:#333342;
}

.badge.live{
    background:#d40000;
}

.info{
    margin-top:10px;
    color:#aaa;
    font-size:13px;
}

.timer{
    margin-top:8px;
    font-size:18px;
    font-weight:bold;
}

.watch{
    width:100%;
    margin-top:12px;
    background:#e00000;
}

.player{
    margin-top:18px;
    background:#101018;
    border-radius:12px;
    overflow:hidden;
    border:1px solid #29293a;
}

.player-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px;
}

.player-title{
    font-weight:bold;
}

iframe{
    width:100%;
    height:500px;
    border:0;
    display:block;
}

.empty{
    padding:35px;
    text-align:center;
    color:#888;
}

@media(max-width:600px){
    .container{
        padding:10px;
    }

    .title{
        font-size:19px;
    }

    iframe{
        height:250px;
    }

    .market-list{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="title">🎯 LINE TOGEL - PASARAN</div>
        <div id="globalStatus" class="live-status">
            ● LIVE OFF
        </div>
    </div>

    <div class="controls">
        <input
            type="text"
            id="search"
            placeholder="🔎 Cari pasaran..."
            oninput="renderMarkets()"
        >

        <select id="filter" onchange="renderMarkets()">
            <option value="all">Semua</option>
            <option value="live">Sedang LIVE</option>
            <option value="upcoming">Akan LIVE</option>
        </select>

        <button onclick="autoLiveToggle()" id="autoBtn">
            AUTO LIVE: ON
        </button>
    </div>

    <div id="marketList" class="market-list"></div>

    <div class="player" id="playerBox" style="display:none">

        <div class="player-head">
            <div class="player-title" id="playerTitle">
                Live Streaming
            </div>

            <button onclick="closePlayer()">✕</button>
        </div>

        <iframe
            id="streamFrame"
            allow="autoplay; fullscreen"
            allowfullscreen>
        </iframe>

    </div>

</div>

<script>

/* =========================================
   DAFTAR PASARAN
   GANTI stream DENGAN LINK STREAMING ASLI
========================================= */

const markets = [

    {
        name:"TOTO MACAU PAGI",
        time:"13:00",
        stream:"",
    },

    {
        name:"KENTUCKY MIDDAY",
        time:"12:30",
        stream:"",
    },

    {
        name:"FLORIDA MIDDAY",
        time:"13:00",
        stream:"",
    },

    {
        name:"HUAHIN 0100",
        time:"01:00",
        stream:"",
    },

    {
        name:"BANGKOK 0130",
        time:"01:30",
        stream:"",
    },

    {
        name:"NEW YORK MIDDAY",
        time:"12:30",
        stream:"",
    },

    {
        name:"BRUNEI 02",
        time:"02:00",
        stream:"",
    },

    {
        name:"BANGKOK 0930",
        time:"09:30",
        stream:"",
    },

    {
        name:"TOTOCAMBODIA",
        time:"18:00",
        stream:"",
    },

    {
        name:"POIPET12",
        time:"12:00",
        stream:"",
    }

];


/* =========================================
   AUTO LIVE
========================================= */

let autoLive = true;
let currentLive = null;


/* =========================================
   CEK WAKTU
========================================= */

function getMinutes(time){

    const [h,m] = time.split(":").map(Number);

    return h * 60 + m;
}


function nowMinutes(){

    const d = new Date();

    return d.getHours() * 60 + d.getMinutes();

}


/* =========================================
   STATUS PASARAN
========================================= */

function getStatus(market){

    const now = nowMinutes();
    const target = getMinutes(market.time);

    let diff = target - now;

    if(diff < -30){
        diff += 1440;
    }

    if(diff <= 0 && diff >= -30){
        return "live";
    }

    return "upcoming";

}


/* =========================================
   COUNTDOWN
========================================= */

function countdown(time){

    const now = new Date();

    const [h,m] = time.split(":").map(Number);

    let target = new Date();

    target.setHours(h,m,0,0);

    if(target < now){
        target.setDate(target.getDate()+1);
    }

    let diff = target-now;

    let sec = Math.floor(diff/1000);

    let hh = Math.floor(sec/3600);

    sec %= 3600;

    let mm = Math.floor(sec/60);

    let ss = sec%60;

    return (
        String(hh).padStart(2,"0") + ":" +
        String(mm).padStart(2,"0") + ":" +
        String(ss).padStart(2,"0")
    );

}


/* =========================================
   RENDER
========================================= */

function renderMarkets(){

    const list = document.getElementById("marketList");

    const search =
        document.getElementById("search").value.toLowerCase();

    const filter =
        document.getElementById("filter").value;

    list.innerHTML = "";

    let visible = markets.filter(m => {

        const status = getStatus(m);

        const matchSearch =
            m.name.toLowerCase().includes(search);

        const matchFilter =
            filter === "all" ||
            filter === status;

        return matchSearch && matchFilter;

    });

    visible.sort((a,b)=>{

        const sa = getStatus(a);
        const sb = getStatus(b);

        if(sa === "live" && sb !== "live") return -1;
        if(sa !== "live" && sb === "live") return 1;

        return getMinutes(a.time)-getMinutes(b.time);

    });


    if(!visible.length){

        list.innerHTML =
            `<div class="empty">
                Pasaran tidak ditemukan.
            </div>`;

        return;

    }


    visible.forEach(market => {

        const status = getStatus(market);

        const div = document.createElement("div");

        div.className =
            "market " +
            (status === "live" ? "active" : "");

        div.innerHTML = `

            <div class="market-top">

                <div class="market-name">
                    ${market.name}
                </div>

                <div class="badge ${status === "live" ? "live" : ""}">
                    ${status === "live" ? "● LIVE" : "UPCOMING"}
                </div>

            </div>

            <div class="info">
                Jadwal: ${market.time}
            </div>

            <div class="timer">
                ${
                    status === "live"
                    ? "🔴 SEDANG LIVE"
                    : "⏱ " + countdown(market.time)
                }
            </div>

            <button
                class="watch"
                onclick="openStream('${escapeQuotes(market.name)}')">

                ▶ BUKA LIVE

            </button>

        `;

        list.appendChild(div);

    });


    updateGlobalStatus();

}


/* =========================================
   ESCAPE
========================================= */

function escapeQuotes(str){

    return str.replace(/'/g,"\\'");

}


/* =========================================
   BUKA STREAM
========================================= */

function openStream(name){

    const market =
        markets.find(x => x.name === name);

    if(!market) return;


    if(!market.stream){

        alert(
            "Link streaming untuk " +
            market.name +
            " belum diisi."
        );

        return;

    }


    document.getElementById("playerBox").style.display="block";

    document.getElementById("playerTitle").innerText =
        "🔴 " + market.name;

    document.getElementById("streamFrame").src =
        market.stream;

    currentLive = market.name;

    window.scrollTo({
        top:document.body.scrollHeight,
        behavior:"smooth"
    });

}


/* =========================================
   TUTUP PLAYER
========================================= */

function closePlayer(){

    document.getElementById("streamFrame").src="";

    document.getElementById("playerBox").style.display="none";

    currentLive=null;

}


/* =========================================
   GLOBAL STATUS
========================================= */

function updateGlobalStatus(){

    const live =
        markets.find(m => getStatus(m)==="live");

    const status =
        document.getElementById("globalStatus");


    if(live){

        status.className =
            "live-status active";

        status.innerHTML =
            "🔴 LIVE: " + live.name;

    }else{

        status.className =
            "live-status";

        status.innerHTML =
            "● LIVE OFF";

    }

}


/* =========================================
   AUTO LIVE
========================================= */

function autoLiveToggle(){

    autoLive = !autoLive;

    document.getElementById("autoBtn").innerText =
        "AUTO LIVE: " +
        (autoLive ? "ON" : "OFF");

}


/* =========================================
   AUTO DETECTION
========================================= */

function checkAutoLive(){

    if(!autoLive) return;

    const liveMarkets =
        markets.filter(m => getStatus(m)==="live");


    if(!liveMarkets.length) return;


    const live =
        liveMarkets[0];


    if(
        currentLive !== live.name &&
        live.stream
    ){

        openStream(live.name);

    }

}


/* =========================================
   UPDATE SETIAP DETIK
========================================= */

setInterval(()=>{

    renderMarkets();

    checkAutoLive();

},1000);


/* =========================================
   START
========================================= */

renderMarkets();

</script>

</body>
</html>
