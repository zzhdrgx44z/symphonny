  <style>
    *{box-sizing:border-box;margin:0;padding:0}

    :root{
      --bg:#090704;
      --panel:rgba(16,12,8,.82);
      --panel-strong:rgba(12,9,6,.94);
      --panel-soft:rgba(35,23,13,.68);
      --gold:#ffbd3a;
      --gold-2:#ff8a00;
      --gold-3:#ffe08a;
      --cream:#fff3d4;
      --text:#fff8eb;
      --text-2:#d9c5a6;
      --muted:#907b61;
      --green:#54e68a;
      --blue:#4bc3ff;
      --red:#ff5c62;
      --line:rgba(255,183,58,.14);
      --line-strong:rgba(255,183,58,.3);
      --shadow:0 24px 80px rgba(0,0,0,.62);
      --radius:20px;
      --radius-sm:14px;
      --pill:999px;
    }

    html{scroll-behavior:smooth;background:var(--bg)}
    body{
      position:relative;
      isolation:isolate;
      min-height:100vh;
      overflow-x:hidden;
      color:var(--text);
      font-family:'DM Sans',sans-serif;
      background:#090704;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    button,input{font:inherit}
    button{-webkit-tap-highlight-color:transparent}

    .scene-gradient{
      position:absolute;inset:0;
      background:
        radial-gradient(circle at 82% 70%,rgba(255,145,20,.12),transparent 30%),
        radial-gradient(circle at 16% 8%,rgba(255,190,65,.06),transparent 34%),
        linear-gradient(115deg,rgba(5,4,3,.52) 0%,rgba(8,6,4,.42) 34%,rgba(24,12,5,.28) 68%,rgba(69,29,6,.16) 100%);
    }
    .scene-grid{
      position:absolute;inset:0;
      background-image:
        linear-gradient(rgba(255,186,63,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,186,63,.025) 1px,transparent 1px);
      background-size:64px 64px;
      mask-image:linear-gradient(to bottom,rgba(0,0,0,.72),transparent 82%);
    }
    .scene-orb{position:absolute;border-radius:50%;filter:blur(3px);opacity:.8;animation:orbFloat 9s ease-in-out infinite alternate}
    .scene-orb.one{width:340px;height:340px;right:-100px;top:8%;background:radial-gradient(circle,rgba(255,171,54,.2),transparent 70%)}
    .scene-orb.two{width:250px;height:250px;left:-80px;bottom:12%;background:radial-gradient(circle,rgba(255,105,0,.12),transparent 70%);animation-delay:-4s}
    @keyframes orbFloat{to{transform:translate3d(0,-24px,0) scale(1.08)}}

    .road-glow{position:fixed;left:0;right:0;bottom:0;height:112px;z-index:1;pointer-events:none;overflow:hidden}
    .road-glow::before{content:"";position:absolute;left:-10%;right:-10%;bottom:-48px;height:120px;background:linear-gradient(180deg,transparent,rgba(3,3,3,.88) 35%,#050403 100%);transform:perspective(350px) rotateX(58deg);border-top:1px solid rgba(255,185,62,.25);box-shadow:0 -10px 35px rgba(255,145,0,.08)}
    .road-glow::after{content:"";position:absolute;left:-20%;bottom:18px;width:140%;height:2px;background:repeating-linear-gradient(90deg,transparent 0 48px,rgba(255,191,55,.88) 48px 118px,transparent 118px 166px);filter:drop-shadow(0 0 10px rgba(255,163,18,.8));animation:roadMove 1.6s linear infinite}
    @keyframes roadMove{to{transform:translateX(-166px)}}

    /* ===== LOADER ===== */
    #loader{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at center,#211306 0,#090704 55%,#040302 100%);transition:.55s ease}
    #loader.hidden{opacity:0;visibility:hidden;pointer-events:none}
    .loader-emblem{position:relative;width:92px;height:92px;border-radius:26px;display:grid;place-items:center;font-family:'Cinzel',serif;font-size:2.7rem;color:#1a1005;background:linear-gradient(145deg,#fff3ba,#ffbb35 48%,#c96700);box-shadow:0 0 0 1px rgba(255,213,114,.38),0 0 45px rgba(255,162,17,.32),inset 0 1px 1px rgba(255,255,255,.75)}
    .loader-emblem::after{content:"";position:absolute;inset:-11px;border:1px solid rgba(255,187,55,.22);border-radius:34px;animation:loaderPulse 1.6s ease-in-out infinite}
    @keyframes loaderPulse{50%{transform:scale(1.08);opacity:.28}}
    .loader-title{font-family:'Cinzel',serif;letter-spacing:.2em;color:var(--cream);font-size:.86rem;font-weight:600}
    .loader-track{width:min(330px,70vw);height:5px;border-radius:10px;background:rgba(255,255,255,.06);overflow:hidden;border:1px solid rgba(255,183,58,.08)}
    .loader-fill{height:100%;width:0;background:linear-gradient(90deg,#a94d00,#ff9f0a,#ffe27b);box-shadow:0 0 18px rgba(255,165,20,.75);transition:width .35s ease}
    .loader-status{font-size:.7rem;color:var(--muted);font-family:'JetBrains Mono',monospace;letter-spacing:.06em}

    /* ===== APP ===== */
    .app-shell{position:relative;z-index:2;width:min(1560px,100%);margin:0 auto;padding:18px 24px 116px}

    .top-nav{
      position:sticky;top:14px;z-index:100;
      min-height:74px;padding:10px 14px 10px 12px;
      display:grid;grid-template-columns:minmax(220px,1fr) auto minmax(220px,1fr);align-items:center;gap:16px;
      background:linear-gradient(135deg,rgba(16,12,8,.92),rgba(31,18,8,.76));
      border:1px solid rgba(255,187,58,.16);border-radius:20px;
      box-shadow:0 18px 55px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.025);
      backdrop-filter:blur(24px) saturate(145%);
    }
    .nav-brand{display:flex;align-items:center;gap:12px;min-width:0}
    .nav-logo{position:relative;width:52px;height:52px;flex:0 0 52px;border-radius:16px;display:grid;place-items:center;font-family:'Cinzel',serif;font-size:1.6rem;font-weight:700;color:#201204;background:linear-gradient(145deg,#fff0a2 0,#ffc13f 45%,#dc7000 100%);box-shadow:0 0 0 1px rgba(255,230,150,.34),0 7px 25px rgba(255,144,0,.3),inset 0 1px 1px rgba(255,255,255,.75)}
    .nav-logo::after{content:"";position:absolute;inset:-4px;border:1px solid rgba(255,186,50,.16);border-radius:20px}
    .brand-copy{min-width:0}
    .brand-title{font-family:'Cinzel',serif;font-weight:700;font-size:1.05rem;color:#ffd369;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .nav-desc{font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .nav-tabs{display:flex;align-items:center;gap:5px;padding:5px;background:rgba(5,4,3,.5);border:1px solid rgba(255,183,58,.1);border-radius:16px;overflow-x:auto;scrollbar-width:none}
    .nav-tabs::-webkit-scrollbar{display:none}
    .nav-tab{position:relative;border:0;color:#bfa98c;background:transparent;border-radius:12px;padding:10px 15px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:.72rem;white-space:nowrap;cursor:pointer;transition:.25s ease}
    .nav-tab i{font-size:.77rem;color:#a68255;transition:.25s ease}
    .nav-tab:hover{color:#fff0d0;background:rgba(255,183,58,.07)}
    .nav-tab.active{color:#1a0e03;background:linear-gradient(135deg,#ffe090,#ffb42e 50%,#e97900);box-shadow:0 7px 25px rgba(255,135,0,.25),inset 0 1px 0 rgba(255,255,255,.65)}

    .refresh-overlay{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(6,5,4,.72);backdrop-filter:blur(10px)}

    .table-scroll{position:relative;z-index:1;min-height:515px;max-height:calc(100vh - 305px);overflow:auto;scrollbar-width:thin;scrollbar-color:rgba(255,183,58,.24) transparent}
    .table-scroll::-webkit-scrollbar{width:7px;height:7px}.table-scroll::-webkit-scrollbar-track{background:transparent}.table-scroll::-webkit-scrollbar-thumb{background:rgba(255,183,58,.2);border-radius:10px}

    /* INDEX dan panel detail memiliki area scroll masing-masing. */

      height:calc(100vh - 305px);
      min-height:515px;
      max-height:calc(100vh - 305px);
      overflow:hidden;
    }
    .index-only-scroll .layout-split{height:100%;min-height:0;overflow:hidden}

    /* ===== TABLE ===== */
    .qna-table{width:100%;border-collapse:separate;border-spacing:0;font-size:.79rem;min-width:760px}

    /* ===== MEMOBONUS SHEET ===== */

    .memo-copy-btn{position:absolute;top:10px;right:12px;width:34px;height:34px;border:1px solid rgba(255,183,58,.17);border-radius:10px;background:rgba(255,169,28,.075);color:#ffc75b;display:grid;place-items:center;cursor:pointer;transition:.22s ease}

    /* ===== RESPONSIVE ===== */
    @media(max-width:1120px){

      .hero{padding:23px 20px;flex-direction:column}.hero-badges{max-width:none;width:100%;justify-content:flex-start}.hero-badge{flex:1;min-width:120px}

    }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}

    /* ===== HD FUTURISTIC CAR ANIMATION ===== */
    .app-shell{padding-bottom:205px}
    .traffic-stage{
      position:fixed;left:0;right:0;bottom:0;height:190px;z-index:70;
      overflow:hidden;pointer-events:none;isolation:isolate;
      filter:drop-shadow(0 -10px 35px rgba(0,0,0,.38));
    }
    .traffic-stage::before{
      content:"";position:absolute;left:0;right:0;bottom:0;height:104px;
      background:
        linear-gradient(180deg,rgba(255,160,20,.04),rgba(5,4,3,.86) 17%,#050403 62%,#020202),
        repeating-linear-gradient(96deg,rgba(255,255,255,.012) 0 1px,transparent 1px 31px);
      border-top:1px solid rgba(255,190,68,.32);
      box-shadow:0 -9px 42px rgba(255,132,0,.1),inset 0 14px 32px rgba(255,158,20,.035);
    }
    .traffic-stage::after{
      content:"";position:absolute;left:-8%;right:-8%;bottom:101px;height:2px;
      background:linear-gradient(90deg,transparent,rgba(255,176,41,.22) 10%,#ffd36c 48%,rgba(255,139,0,.35) 78%,transparent);
      box-shadow:0 0 14px rgba(255,171,27,.8),0 0 34px rgba(255,122,0,.32);
    }
    .traffic-lane{
      position:absolute;left:-20%;bottom:42px;width:160%;height:4px;z-index:1;
      background:repeating-linear-gradient(90deg,transparent 0 55px,rgba(255,200,92,.82) 55px 135px,transparent 135px 190px);
      transform:perspective(320px) rotateX(58deg);
      filter:drop-shadow(0 0 8px rgba(255,167,21,.65));
      animation:trafficLane 1.05s linear infinite;
    }
    .traffic-reflection{
      position:absolute;left:0;right:0;bottom:0;height:82px;z-index:1;
      background:

  <script>
/* ── Data Logic ── */
const SID='19AodSFSw4shpSZVZ4I-_sD91eU1HPITMeg4cwLiEV1c';
const SHEETS=['bonus','PK_anti_audit','PK_LULUS_SENSOR_AUDIT','seputar_gantirek','seputar_pk'];
const COPY_COL3=['PK_LULUS_SENSOR_AUDIT','seputar_gantirek','seputar_pk'];
const SIDEBAR_SHEETS=['PK_anti_audit'];
let allData={},currentSheet='bonus',isRefreshing=false;

async function fetchSheet(sn){
  try{
    const r=await fetch(`https://docs.google.com/spreadsheets/d/${SID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sn)}`);
    const t=await r.text();
    const j=JSON.parse(t.substring(47,t.length-2));
    if(!j.table?.rows)return[];
    const c=j.table.cols||[],h=c.map(col=>col.label||`col_${col.id}`);
    const rows=j.table.rows.map(row=>{
      const o={};
      row.c?.forEach((cell,idx)=>{o[h[idx]||`col_${idx}`]=cell?cell.v:null;});
      return o;
    });
    return sn==='bonus'?normalizeBonusRows(rows):rows;
  }catch(e){return[];}
}

async function loadAllSheets(silent){if(!silent){let p=0;const step=100/SHEETS.length;const lb=document.getElementById('loaderBar'),ls=document.getElementById('load-status');for(const n of SHEETS){ls.innerText=`Sinkronisasi ${n.replace(/_/g,' ')}...`;allData[n]=await fetchSheet(n);p+=step;lb.style.width=`${Math.min(p,100)}%`;await new Promise(r=>setTimeout(r,30));}ls.innerText='Selesai';lb.style.width='100%';setTimeout(()=>{document.getElementById('loader').classList.add('hidden');renderSheet(currentSheet);},400);}else{for(const n of SHEETS)allData[n]=await fetchSheet(n);renderSheet(currentSheet);}}

async function handleRefresh(){if(isRefreshing)return;isRefreshing=true;const btn=document.getElementById('refreshBtn'),icon=document.getElementById('refreshIcon'),text=document.getElementById('refreshText'),ov=document.getElementById('refreshOverlay');btn.classList.add('is-loading');icon.classList.add('icon-spin');text.textContent='Loading...';ov.classList.add('active');try{await loadAllSheets(true);showToast('Data berhasil diperbarui!','success');}catch(e){showToast('Gagal memuat data.','info');}ov.classList.remove('active');btn.classList.remove('is-loading');icon.classList.remove('icon-spin');text.textContent='Refresh';isRefreshing=false;}

function esc(s){if(!s)return'';return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]||m);}

/*
 * Kolom BONUS dibaca berdasarkan nama header, bukan hanya urutan kolom.
 * Jika sheet lama belum memiliki header, kolom A dipakai sebagai BONUS dan
 * kolom B dipakai sebagai memobonus agar data lama tetap dapat ditampilkan.
 */
function normalizeColumnName(value){return String(value??'').trim().toLowerCase().replace(/[\s_-]+/g,'');}

function findColumnKey(row,names,fallbackIndex){
  const keys=Object.keys(row||{}),wanted=names.map(normalizeColumnName);
  return keys.find(key=>wanted.includes(normalizeColumnName(key)))||keys[fallbackIndex]||null;
}

function normalizeBonusRows(rows){
  return rows.map(row=>{
    const keys=Object.keys(row||{});
    const bonusKey=findColumnKey(row,['bonus','judulbonus','nama bonus','judul','title'],0);
    let memoKey=findColumnKey(row,['memobonus','memo bonus','memo_bonus'],1);
    if(memoKey===bonusKey)memoKey=keys.find(key=>key!==bonusKey)||null;
    return {
      BONUS:bonusKey?row[bonusKey]:'',
      MEMOBONUS:memoKey?row[memoKey]:''
    };
  }).filter(row=>[row.BONUS,row.MEMOBONUS].some(value=>value!==null&&value!==undefined&&String(value).trim()!==''));
}

function getBonusValue(row){
  const bonusKey=findColumnKey(row,['bonus','judulbonus','nama bonus','judul','title'],0);
  return bonusKey?row[bonusKey]:'';
}

function getMemoBonusValue(row){
  const memoKey=findColumnKey(row,['memobonus','memo bonus','memo_bonus'],1);
  return memoKey?row[memoKey]:'';
}

function getSidebarFields(row,sheetName){
  const keys=Object.keys(row||{});
  if(sheetName==='bonus'){
    const titleKey=findColumnKey(row,['judulbonus','nama bonus','bonus','judul','title'],0);
    const memoKey=findColumnKey(row,['memobonus','memo bonus','memo_bonus'],1);
    return {
      title:titleKey?row[titleKey]:'',
      detail:memoKey&&memoKey!==titleKey?row[memoKey]:''
    };
  }

  return {
    title:keys[0]?row[keys[0]]:'',
    detail:keys.slice(1).map(key=>row[key]).filter(value=>value!==null&&value!==undefined&&value!=='').join('\n\n')
  };
}

function renderQna(data){if(!data.length)return'<div class="empty-state"><i class="fas fa-inbox"></i>Tidak ada data</div>';const k=Object.keys(data[0]),cA=k[0],cB=k[1],cC=k[2]||null,oC=COPY_COL3.includes(currentSheet),tableClass=currentSheet==='seputar_pk'?'qna-table seputar-pk-table':'qna-table';let h=`<table class="${tableClass}"><thead><tr><th>${esc(cA)}</th>${cC?`<th>${esc(cB)}</th><th>${esc(cC)}</th>`:`<th>${esc(cB)}</th>`}<th style="width:100px;">Aksi</th></tr></thead><tbody>`;data.forEach((r,i)=>{const v1=r[k[0]]||'',v2=r[k[1]]||'',v3=cC?(r[k[2]]||''):'';let ct=oC?(v3||v2||v1):[v1,v2,v3].filter(Boolean).join(' — ');h+=`<tr class="row-anim" style="animation-delay:${i*0.01}s"><td>${esc(v1)}</td>${cC?`<td>${esc(v2)}</td><td>${esc(v3)}</td>`:`<td>${esc(v2)}</td>`}<td class="col-action"><button class="copy-btn" data-text="${esc(ct)}"><i class="fas fa-copy"></i> Salin</button></td></tr>`;});h+='</tbody></table>';return h;}

function renderMemoBonusSheet(data){
  if(!data.length)return'<div class="memo-sheet-empty"><i class="fas fa-table-cells" style="display:block;margin-bottom:12px;font-size:1.6rem;"></i>Tidak ada data bonus</div>';
  let h='<table class="memo-sheet"><thead><tr><th class="sheet-corner">#</th><th class="sheet-heading bonus-heading">BONUS</th><th class="sheet-heading memo-heading">MEMOBONUS</th></tr></thead><tbody>';
  data.forEach((row,index)=>{
    const bonus=getBonusValue(row);
    const memo=getMemoBonusValue(row);
    h+=`<tr class="row-anim" style="animation-delay:${index*0.01}s"><td class="sheet-row-number">${index+1}</td><td class="bonus-cell">${esc(bonus)}</td><td class="memo-cell">${esc(memo)}${memo?`<button class="copy-btn memo-copy-btn" data-text="${esc(memo)}" title="Salin MEMOBONUS" aria-label="Salin MEMOBONUS baris ${index+1}"><i class="fas fa-copy"></i></button>`:''}</td></tr>`;
  });
  return h+'</tbody></table>';
}

function renderSidebarLayout(data){if(!data.length)return'<div class="empty-state"><i class="fas fa-inbox"></i>Tidak ada data</div>';let h=`<div class="layout-split"><div class="sidebar-col"><div class="sidebar-header"><span><i class="fas fa-list" style="font-size:0.55rem;margin-right:8px;"></i> Index</span> <span class="sidebar-count">${data.length}</span></div><div class="sidebar-list">`;data.forEach((r,i)=>{const fields=getSidebarFields(r,currentSheet);h+=`<div class="sidebar-item" data-index="${i}"><span class="item-num">${String(i+1).padStart(2,'0')}</span> ${esc(fields.title||`Item ${i+1}`)}</div>`;});h+=`</div></div><div class="detail-col" id="detailPanel"><div class="detail-content" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:280px;color:var(--text-muted);gap:14px;"><i class="fas fa-arrow-left" style="font-size:1.8rem;opacity:0.1;"></i><span style="font-size:0.85rem;">Pilih item dari daftar</span></div></div></div>`;return h;}

function initSidebarInteraction(data){const items=document.querySelectorAll('.sidebar-item'),panel=document.getElementById('detailPanel');if(!items.length)return;const update=i=>{const fields=getSidebarFields(data[i],currentSheet),t=fields.title||'-',d=fields.detail||'-';panel.innerHTML=`<div class="detail-content"><div class="detail-title"><i class="fas fa-bookmark"></i> ${esc(t)}</div><div class="detail-body">${esc(d)}</div><button class="copy-btn detail-copy-btn" data-desc="${esc(d)}"><i class="fas fa-copy"></i> Copy Memo Bonus</button></div>`;panel.scrollTop=0;};items.forEach(item=>{item.addEventListener('click',()=>{items.forEach(i=>i.classList.remove('active'));item.classList.add('active');update(parseInt(item.dataset.index));});});if(items[0]){items[0].classList.add('active');update(0);}}

function renderSheet(sn){currentSheet=sn;const dn={'bonus':'BONUS','PK_anti_audit':'PK ANTI AUDIT','PK_LULUS_SENSOR_AUDIT':'PK LULUS AUDIT','seputar_gantirek':'GANTI REK','seputar_pk':'SEPUTAR PK'};const pageTitle=document.getElementById('pageTitle'),pageSubtitle=document.getElementById('pageSubtitle'),searchInput=document.getElementById('searchInput');if(pageTitle)pageTitle.textContent=dn[sn]||sn.replace(/_/g,' ').toUpperCase();if(pageSubtitle)pageSubtitle.textContent='Data Sheet';document.querySelectorAll('.nav-tab').forEach(el=>el.classList.toggle('active',el.dataset.sheet===sn));searchInput.value='';searchInput.placeholder=sn==='bonus'?'Cari BONUS atau MEMOBONUS...':'Cari data...';const data=allData[sn]||[],c=document.getElementById('tableContainer'),isMemoBonus=sn==='bonus',isSidebar=SIDEBAR_SHEETS.includes(sn);c.classList.toggle('memo-sheet-scroll',isMemoBonus);c.classList.toggle('index-only-scroll',isSidebar);if(isMemoBonus){c.innerHTML=renderMemoBonusSheet(data);}else if(isSidebar){c.innerHTML=renderSidebarLayout(data);setTimeout(()=>initSidebarInteraction(data),30);}else{c.innerHTML=renderQna(data);}}

function handleSearch(){const q=document.getElementById('searchInput').value.toLowerCase(),data=allData[currentSheet]||[];if(!data.length)return;if(currentSheet==='bonus'){document.getElementById('tableContainer').innerHTML=renderMemoBonusSheet(data.filter(row=>[getBonusValue(row),getMemoBonusValue(row)].some(value=>String(value||'').toLowerCase().includes(q))));}else if(SIDEBAR_SHEETS.includes(currentSheet)){const items=document.querySelectorAll('.sidebar-item');let f=-1;items.forEach((item,i)=>{const m=Object.values(data[i]).some(v=>v&&String(v).toLowerCase().includes(q));item.style.display=m?'flex':'none';if(m&&f===-1)f=i;});const a=document.querySelector('.sidebar-item.active');if((!a||a.style.display==='none')&&f!==-1)document.querySelector(`.sidebar-item[data-index="${f}"]`)?.click();}else{document.getElementById('tableContainer').innerHTML=renderQna(data.filter(r=>Object.values(r).some(v=>v&&String(v).toLowerCase().includes(q))));}}

async function copyText(text){try{await navigator.clipboard.writeText(text);return true;}catch{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');return true;}catch{return false;}finally{document.body.removeChild(ta);}}}

function showToast(msg,type){const c=document.getElementById('notif-container'),t=document.createElement('div');t.className='toast toast-'+(type||'success');const ic=type==='info'?'fa-circle-info':'fa-circle-check';t.innerHTML=`<i class="fas ${ic}"></i> ${msg}`;c.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(20px) scale(0.95)';setTimeout(()=>t.remove(),300);},3500);}

function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-GB');}
setInterval(updateClock,1000);updateClock();

document.querySelectorAll('.nav-tab').forEach(tab=>{tab.addEventListener('click',()=>renderSheet(tab.dataset.sheet));});
document.getElementById('refreshBtn').addEventListener('click',handleRefresh);
document.getElementById('searchInput').addEventListener('input',handleSearch);
document.addEventListener('click',async e=>{const btn=e.target.closest('.copy-btn');if(!btn)return;let t=btn.dataset.text||btn.dataset.desc||'';if(t){e.preventDefault();const ok=await copyText(t);if(ok)showToast('Berhasil disalin!','success');else showToast('Gagal menyalin.','info');btn.style.transform='scale(0.92)';setTimeout(()=>{if(btn)btn.style.transform='';},180);}});

loadAllSheets(false);
  </script>
</body>
</html>
